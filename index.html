<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aedan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --fg: #ececec;
    --muted: #8a8a8f;
    --accent: #e8484f;
    --line: #28282c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Fraunces', Georgia, serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background-image: radial-gradient(circle at 20% 30%, rgba(232,72,79,0.06), transparent 40%);
  }
  main {
    max-width: 580px;
    width: 100%;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
    margin-bottom: 1.25rem;
  }
  p.intro {
    font-size: 1.15rem;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  .links {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--line);
  }
  .links a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--line);
    color: var(--fg);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    transition: padding-left 0.25s ease, color 0.25s ease;
  }
  .links a:hover {
    padding-left: 1rem;
    color: var(--accent);
  }
  .links a .arrow {
    color: var(--muted);
    transition: transform 0.25s ease, color 0.25s ease;
  }
  .links a:hover .arrow {
    transform: translateX(4px);
    color: var(--accent);
  }
  footer {
    margin-top: 2.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <div class="eyebrow">University of Maryland</div>
    <h1>aedan</h1>
    <p class="intro">Hi — this is my personal page. Most of my work lives on GitHub. Take a look below.</p>
    <nav class="links">
      <a href="https://github.com/aedan-umd">
        <span>GitHub &middot; @aedan-umd</span>
        <span class="arrow">&rarr;</span>
      </a>
    </nav>
    <footer>terpconnect.umd.edu/~aedan</footer>
  </main>
</body>
</html>
